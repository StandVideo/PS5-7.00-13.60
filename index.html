<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PS5-Relapse</title>

<style>

html,body{

    margin:0;

    padding:0;

    min-height:100vh;

    width:100%;

    background:#0b0d10 url("img/BG.jpg") center center/cover no-repeat fixed;

    color:#c8ced8;

    font:15px/1.45 "Segoe UI",system-ui,sans-serif;

}

    #cache-status {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 9999;
      font-size: 14px;
      color: #aaa;
      pointer-events: none;
    }

    #console {
      position: relative;
      z-index: 1;
    }
  </style>
</head>

<body>

  <div id="cache-status">checking cache...</div>

  <div id="console"></div>

  <!-- Tes scripts restent exactement dans le même ordre -->
  <script src="./src/firmware.js"></script>
  <script src="./src/main.js"></script>
  <script src="./src/rop.js"></script>
  <script src="./src/utils/syscalls.js"></script>
  <script type="module" src="./src/site.js"></script>

  <!-- Affichage du cache uniquement -->
  <script>
  (function () {

    var status = document.getElementById("cache-status");
    var ac = window.applicationCache;

    function show(text) {
      if (status) {
        status.textContent = text;
      }
    }

    if (!ac) {
      show("cache unavailable");
      return;
    }

    ac.addEventListener("checking", function () {
      show("checking cache...");
    }, false);

    ac.addEventListener("downloading", function () {
      show("caching 0%");
    }, false);

    ac.addEventListener("progress", function (e) {
      if (e && e.total > 0) {
        var percent = Math.round((e.loaded / e.total) * 100);
        show("caching " + percent + "%");
      } else {
        show("caching...");
      }
    }, false);

    ac.addEventListener("cached", function () {
      show("cached for offline use");
    }, false);

    ac.addEventListener("noupdate", function () {
      show("cache ready");
    }, false);

    ac.addEventListener("updateready", function () {
      show("cache updated");
    }, false);

    ac.addEventListener("error", function () {
      show("cache unavailable");
    }, false);

    ac.addEventListener("obsolete", function () {
      show("cache obsolete");
    }, false);

    if (!navigator.onLine) {
      show("offline -- from cache");
    }

  })();
  </script>

</body>
</html>
