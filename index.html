<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stand PS5 Jailbreak</title>
<style>
html,body{margin:0;padding:0;min-height:100vh;width:100%;background:#0b0d10 url("img/BG.jpg") center center/cover no-repeat fixed;color:#c8ced8;font:15px/1.45 "Segoe UI",system-ui,sans-serif}
#wrap{padding:16px 18px}
#state{font-size:22px;font-weight:700;margin:0 0 6px}
#det{font-size:13px;color:#8b95a3;margin:0 0 4px}
#cache{font-size:12px;color:#5c6672;margin:0 0 10px;min-height:14px}
#cache.cacheok{color:#7fd0a0}
.ok{color:#7fd0a0}.bad{color:#d08a7f}.warn{color:#d8c07f}
</style>
</head>
<body>
<div id="wrap"><div id="state">loading...</div><div id="det"></div><div id="cache"></div></div>
<script>
(function(){
var stateEl=document.getElementById("state"),detEl=document.getElementById("det"),cacheEl=document.getElementById("cache");
function setState(t,c){stateEl.textContent=t;stateEl.className=c||""}
function setCache(t,ok){cacheEl.textContent=t;cacheEl.className=ok?"cacheok":""}
var ac=window.applicationCache;
if(!ac||!document.documentElement.hasAttribute("manifest")){setCache("cache unavailable");setState("loading...","warn")}
else if(!navigator.onLine){setCache("offline -- from cache",true);setState("offline ready","ok")}
else if(ac.status===ac.IDLE){setCache("cached",true);setState("cache ready","ok")}
else if(ac.status===ac.UPDATEREADY){
try{ac.swapCache()}catch(e){}
setCache("update downloaded",true);
setState("UPDATE READY -- press X or tap to reload","warn");
function reload(){window.removeEventListener("click",reload);window.removeEventListener("keydown",reload);location.reload()}
window.addEventListener("click",reload);window.addEventListener("keydown",reload)
}else{
setCache("checking cache...");
ac.addEventListener("checking",function(){setCache("checking cache...")},false);
ac.addEventListener("downloading",function(){setState("caching...","warn");setCache("caching for offline (first run)...")},false);
ac.addEventListener("progress",function(e){
if(e&&e.total){var percent=Math.round((e.loaded/e.total)*100);setState("caching "+percent+"%","warn");setCache("caching "+percent+"%")}
else{setState("caching...","warn");setCache("caching for offline (first run)...")}
},false);
ac.addEventListener("cached",function(){setState("cache ready","ok");setCache("cached for offline use",true)},false);
ac.addEventListener("updateready",function(){try{ac.swapCache()}catch(e){}setState("cache updated","ok");setCache("update downloaded",true)},false);
ac.addEventListener("noupdate",function(){setState("cache ready","ok");setCache("cached -- offline ready",true)},false);
ac.addEventListener("error",function(){setState("CACHE FAILED","bad");setCache("cache unavailable")},false);
ac.addEventListener("obsolete",function(){setState("CACHE OBSOLETE","bad");setCache("cache obsolete")},false)
}
})();
</script>
<script src="./src/firmware.js"></script>
<script src="./src/main.js"></script>
<script src="./src/rop.js"></script>
<script src="./src/utils/syscalls.js"></script>
<script type="module" src="./src/site.js"></script>
</body>
</html>
